# Collection settings for RoomVisit / invisible_displacement episodes.
# Every tunable number used by the collector lives here. Change values here only.
# Robot motion (turn angle, step length) and the camera stay in
# utils/constants/stretch_initialization_utils.py; this file never repeats them.

episode:
  # Wall-clock limit per episode (seconds). On timeout the collector saves what it
  # has (save_reason "timeout", truncated true) and the episode ends.
  # Round 3 (10 houses, local GPU): longest episode 112 s, ~0.2 s/step. 600 s ≈ 5x.
  timeout_s: 600
  # Policy-step cap per episode (glance turns are extra). Clamps the task horizon
  # (RoomVisit default 1000) so long walks do not slow cm-benchmark generation.
  # Frames per walk: Round 3 18-625, Round 4 16-1013 (one hit the 1000 horizon).
  # null keeps the task horizon.
  max_policy_steps: 600
  # Ignore the policy's `done` while some room of the house has not been visited
  # (agent position inside the room polygon, the navigation `visited-rooms` column;
  # not the policy's own sub_done "seen" marks). The ignored `done` becomes one
  # `done_override_action`, so the policy gets a new view to re-plan from instead
  # of repeating `done` on the same frame. max_policy_steps and timeout_s still end
  # the episode. Round 6 (10 houses): 3 walks stopped with rooms unvisited
  # (2/5, 4/5, 2/3); the other `done` walks had visited every room.
  continue_until_all_rooms_visited: true
  # After this many ignored `done`s in one episode the next `done` is accepted
  # (16 turns of 45 degrees = two full turns in place).
  max_done_overrides: 16
  done_override_action: rotate_right

glance:
  # Open-loop glance at nearby movable objects so the ID construct gets a clear
  # encode sighting. Turn a fixed number of times, never loop until visible.
  # The targets are the placement-trial objects: every pickupable and, with
  # placement.include_moveable, moveable objects up to placement.moveable_max_mass_kg.
  enabled: true
  # Area floor the glance aims for: fraction of the frame the object should cover.
  # Matches cm-benchmark named_min_frame_fraction (1% of 396x224 = 887 px).
  min_frame_fraction: 0.01
  # Trigger only when the expected area is at least this multiple of the floor
  # (margin for occlusion, partial view and the pinhole estimate).
  area_margin: 1.5
  # Hard cap on distance (m), whatever the object's size.
  max_distance_m: 2.5
  # Turns per glance. With 45° turns, 2 turns cover bearings up to 112.5°;
  # objects further behind are skipped.
  max_turns: 2
  # Turn back to the original heading after the glance, so the policy resumes
  # from the pose it chose.
  rotate_back: true
  # Episode limits: one glance per object, at most this many per episode,
  # and at least this many policy steps between glances.
  max_per_episode: 8
  min_steps_between: 5

placement:
  # scripts/placement_trials.py: where each movable object could be moved (ID construct).
  # Also try `moveable` objects that are not pickupable (chairs, plants, lamps, bins).
  # Pickupables are small: in Round 4 (10 houses) only 22 of 155 placed-and-seen
  # pickupables ever covered 1% of the frame, so almost none could be asked about.
  include_moveable: true
  # Heavier furniture is not moved (THOR mass: Chair 10, ArmChair 28, Bed 30,
  # Dresser 57, DiningTable 85, Sofa 104). Objaverse assets report 1.0, so
  # cm-benchmark still decides by size which moved objects it asks about.
  # An object with anything resting on it is never moved.
  moveable_max_mass_kg: 30
  top_receptacles: 5  # most salient non-openable receptacles tried per room
  top_landmarks: 5  # floor landmarks per room (also the world_layout landmark list)
  max_receptacle_spawns: 3  # spawn points tried per receptacle
  max_floor_spawns: 3  # floor points tried per landmark, nearest to its box first
  # A floor point must be at least the object's half footprint plus this margin
  # away from the landmark's box, so the object does not start inside the landmark.
  floor_clearance_margin_m: 0.05
  # Points tried on one receptacle are at least this far apart (xz). Adjacent points
  # (2-4 cm) are all blocked by the same object already standing there.
  min_spawn_separation_m: 0.25
  # PlaceObjectAtPoint puts the object's position (its pivot, near the centre) at
  # the point, so the target is raised by pivot-to-bottom height plus this gap.
  # Without it the object intersects the surface ("Spawn area not clear").
  lift_epsilon_m: 0.01
  physics_settle_steps: 10  # AdvancePhysicsStep calls after a house reload
  # Seconds one trial step (place, teleport back, read) may take before the
  # simulator counts as hung. Trial steps take well under a second; the house
  # reload keeps the controller's long timeout (MAXIMUM_SERVER_TIMEOUT).
  step_timeout_s: 120
  # After a hang the simulator is restarted; a fresh Unity can crash at start
  # while the old one's GPU memory is being freed, so wait and try again.
  restart_attempts: 3
  restart_wait_s: 30
  # After a trial the object is teleported back; farther than this from its
  # original position counts as a failed restore and the house is reloaded.
  restore_tolerance_m: 0.01
